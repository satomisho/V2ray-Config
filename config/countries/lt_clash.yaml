    type: vless
    server: "88.216.69.30"
    port: 8880
    uuid: "6202b230-417c-4d8e-b624-0f71afa9c75d"
    udp: true
    network: ws
    ws-opts:
      path: "/"
      headers:
        Host: "vms.lifetime06.workers.dev"
  - name: "🇱🇹_2"
    type: vless
    server: "84.32.215.5"
    port: 443
    uuid: "c5694dc5-39fd-4a92-8430-3837baa522a3"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "lt.aether-runet.top"
    client-fingerprint: "chrome"
    reality-opts:
      public-key: "vrcsm8L_tY7sNbnCEdLCEjOthh_w9bdWS3wFPgsIomk"
      short-id: "4fa44664f6a566d3"
    flow: "xtls-rprx-vision"
  - name: "🇱🇹_3"
