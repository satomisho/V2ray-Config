    port: 443
    uuid: "f1c496bf-d2ab-45be-bc13-051d60d227b7"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "dartsearch-cn.net"
    client-fingerprint: "firefox"
    reality-opts:
      public-key: "00n9LplaZ0VGvRS57548s7xe0deFC10pw2fkFHFPplM"
      short-id: ""
    flow: "xtls-rprx-vision"
  - name: "🇱🇹_2"
    type: vless
    server: "144.31.243.148"
