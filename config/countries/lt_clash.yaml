    type: vless
    server: "89.125.248.243"
    port: 443
    uuid: "51a0af77-a60c-4d9b-81a4-f50e1b38d90b"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "cf3.schzyc.cc.cd"
    client-fingerprint: "chrome"
    network: ws
    ws-opts:
      path: "/proxyip=ProxyIP.CMLiussss.net"
      headers:
        Host: "cf3.schzyc.cc.cd"
  - name: "🇱🇹_2"
    type: vless
    server: "144.31.243.120"
    port: 8443
    uuid: "fdc48be3-a615-41ac-8bd1-ed844c931048"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "edgetunnel-4uw.pages.dev"
    client-fingerprint: "chrome"
    network: ws
    ws-opts:
      path: "/"
      headers:
        Host: "edgetunnel-4uw.pages.dev"
  - name: "🇱🇹_3"
    type: vless
    server: "62.77.158.1"
    port: 443
    uuid: "2eceaf2b-a775-5a9c-9990-dad2b3660fb6"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "online.1c.ru"
    client-fingerprint: "safari"
    reality-opts:
      public-key: "sVhkyiMXvpofflCdSszxQmsqOXV1kg1Ldxq1a9mOPjs"
