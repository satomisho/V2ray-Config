    server: "85.90.197.147"
    port: 443
    uuid: "2cb6b4d9-0c74-45e2-a4fb-645bb8ac532a"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "grek.o4ka-internet.com"
    client-fingerprint: "firefox"
    reality-opts:
      public-key: "V2JprbR_aJkS7uX6anyU3nrswGxdvDQT2HpY4WnzuC8"
      short-id: "5629431325884ff0"
    flow: "xtls-rprx-vision"
  - name: "🇬🇷_2"
    type: vless
