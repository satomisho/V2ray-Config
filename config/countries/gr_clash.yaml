    udp: true
    tls: true
    skip-cert-verify: true
    servername: "grek.o4ka-internet.com"
    client-fingerprint: "firefox"
    reality-opts:
      public-key: "V2JprbR_aJkS7uX6anyU3nrswGxdvDQT2HpY4WnzuC8"
