name: "Standard"
mixed-port: 7890
socks-port: 7891
port: 7892
allow-lan: true
bind-address: '*'
mode: global
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
external-ui: ui
secret: ""
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
find-process-mode: strict
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.local'
    - '*.lan'
    - '*.localhost'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - 'time.*'
    - 'time.*.com'
    - 'connectivitycheck.gstatic.com'
    - 'detectportal.firefox.com'
    - 'captive.apple.com'
    - 'www.msftncsi.com'
    - 'cp.cloudflare.com'
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 9.9.9.9
    - 149.112.112.112
    - 208.67.222.222
    - 94.140.14.14
    - 64.6.64.6
    - 84.200.69.80
    - 76.76.19.19
    - 8.26.56.26
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
    - https://dns.quad9.net/dns-query
    - https://dns.adguard.com/dns-query
    - https://doh.opendns.com/dns-query
    - https://doh.comodo.com/dns-query
    - https://doh.mullvad.net/dns-query
    - https://doh.dns.mullvad.net/dns-query
    - https://freedns.controld.com/p0
    - https://freedns.controld.com/family

proxies:
  - name: "🇹🇭_1"
    type: vless
    server: "V2rAy.SiMsPeEdUp.CoM"
    port: 80
    uuid: "3c52e091-6714-4915-949f-2149fe69951b"
    udp: true
    network: ws
    ws-opts:
      path: "/ws"
      headers:
        Host: "aIs.SpEeDtEsT.nEt"
  - name: "🇹🇭_2"
    type: vless
    server: "103.86.49.57"
    port: 80
    uuid: "3c52e091-6714-4915-949f-2149fe69951b"
    udp: true
    network: ws
    ws-opts:
      path: "/ws"
      headers:
        Host: "aIs.SpEeDtEsT.nEt"
  - name: "🇹🇭_3"
    type: vless
    server: "43.133.110.81"
    port: 443
    uuid: "77777777-8a3e-6666-b6d1-a9c5f0e8b3a2"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "faxf32gkfzoxqv.fx6hsv0.ccwu.cc"
    client-fingerprint: "chrome"
    network: ws
    ws-opts:
      path: "/"

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "Auto"

  - name: "Auto"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 30
    lazy: true
    proxies:
      - "🇹🇭_1"
      - "🇹🇭_2"
      - "🇹🇭_3"


rules:
  - MATCH,PROXY
