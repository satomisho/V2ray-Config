      - "🇹🇼_19"
      - "🇹🇼_20"
      - "🇹🇼_21"
      - "🇹🇼_22"

  # ── Manual selector ───────────────────────────────────────────────────────
  - name: "MANUAL"
    type: select
    proxies:
      - "🇹🇼_12"
      - "🇹🇼_13"
      - "🇹🇼_14"
