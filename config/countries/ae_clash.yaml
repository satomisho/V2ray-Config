name: "Standard"
mixed-port: 7890
socks-port: 7891
port: 7892
allow-lan: true
bind-address: '*'
mode: global
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
external-ui: ui
secret: ""
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
find-process-mode: strict
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.local'
    - '*.lan'
    - '*.localhost'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - 'time.*'
    - 'time.*.com'
    - 'connectivitycheck.gstatic.com'
    - 'detectportal.firefox.com'
    - 'captive.apple.com'
    - 'www.msftncsi.com'
    - 'cp.cloudflare.com'
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 9.9.9.9
    - 149.112.112.112
    - 208.67.222.222
    - 94.140.14.14
    - 64.6.64.6
    - 84.200.69.80
    - 76.76.19.19
    - 8.26.56.26
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
    - https://dns.quad9.net/dns-query
    - https://dns.adguard.com/dns-query
    - https://doh.opendns.com/dns-query
    - https://doh.comodo.com/dns-query
    - https://doh.mullvad.net/dns-query
    - https://doh.dns.mullvad.net/dns-query
    - https://freedns.controld.com/p0
    - https://freedns.controld.com/family

proxies:
  - name: "🇦🇪_1"
    type: vless
    server: "uaenoad.whooisthebest.ir"
    port: 22216
    uuid: "5c5619e4-0577-48d4-8d0c-6ad9c5cc0ecf"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "amp-api-edge.apps.apple.com"
    client-fingerprint: "chrome"
    reality-opts:
      public-key: "sTE0YXI6Pv6OQUNbM-hNpNOhzon0_m2YUd7B1_g-JAU"
      short-id: "0f4412d42129f080"
  - name: "🇦🇪_2"
    type: vless
    server: "dubai.k44lawm.ir"
    port: 8089
    uuid: "7659430c-4124-4f15-aee5-2be5d76f7e44"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "amp-api-edge.apps.apple.com"
    client-fingerprint: "chrome"
    reality-opts:
      public-key: "gFwma9eqtPG1yXG081Rf92zGIbNKftUzkr9pe9bceT8"
      short-id: "06a5bdde43252ba3"

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "Auto"

  - name: "Auto"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 30
    lazy: true
    proxies:
      - "🇦🇪_1"
      - "🇦🇪_2"


rules:
  - MATCH,PROXY
