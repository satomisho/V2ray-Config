name: "Standard"
mixed-port: 7890
socks-port: 7891
port: 7892
allow-lan: true
bind-address: '*'
mode: global
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
external-ui: ui
secret: ""
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
find-process-mode: strict
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.local'
    - '*.lan'
    - '*.localhost'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - 'time.*'
    - 'time.*.com'
    - 'connectivitycheck.gstatic.com'
    - 'detectportal.firefox.com'
    - 'captive.apple.com'
    - 'www.msftncsi.com'
    - 'cp.cloudflare.com'
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 9.9.9.9
    - 149.112.112.112
    - 208.67.222.222
    - 94.140.14.14
    - 64.6.64.6
    - 84.200.69.80
    - 76.76.19.19
    - 8.26.56.26
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
    - https://dns.quad9.net/dns-query
    - https://dns.adguard.com/dns-query
    - https://doh.opendns.com/dns-query
    - https://doh.comodo.com/dns-query
    - https://doh.mullvad.net/dns-query
    - https://doh.dns.mullvad.net/dns-query
    - https://freedns.controld.com/p0
    - https://freedns.controld.com/family

proxies:
  - name: "🇺🇿_1"
    type: vless
    server: "189.74.97.47"
    port: 2087
    uuid: "894fe9f0-b998-49c0-8003-a5007de921e1"
    udp: true
    network: ws
    ws-opts:
      path: "/755276b33b6f"
  - name: "🇺🇿_2"
    type: vless
    server: "157.22.133.130"
    port: 2087
    uuid: "e6d369db-22be-4f30-8685-455c717aaa8c"
    udp: true
    network: ws
    ws-opts:
      path: "/5021201ef53f"
  - name: "🇺🇿_3"
    type: vless
    server: "189.74.97.43"
    port: 2087
    uuid: "10f7eb2d-d96d-4778-9d36-aff11e9d6629"
    udp: true
    network: ws
    ws-opts:
      path: "/73b6faea2d00"

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "Auto"

  - name: "Auto"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 30
    lazy: true
    proxies:
      - "🇺🇿_1"
      - "🇺🇿_2"
      - "🇺🇿_3"


rules:
  - MATCH,PROXY
