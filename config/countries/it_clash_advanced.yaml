      - "🇮🇹_19"
      - "🇮🇹_20"

  - name: "FAST-CDN"
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    proxies:
      - "🇮🇹_11"
      - "🇮🇹_12"
