mixed-port: 7890
socks-port: 7891
port: 7892
allow-lan: true
bind-address: '*'
mode: global
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
external-ui: ui
secret: ""
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
find-process-mode: strict
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.local'
    - '*.lan'
    - '*.localhost'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - 'time.*'
    - 'time.*.com'
    - 'connectivitycheck.gstatic.com'
    - 'detectportal.firefox.com'
    - 'captive.apple.com'
    - 'www.msftncsi.com'
    - 'cp.cloudflare.com'
  default-nameserver:
    - 178.22.122.100
    - 185.51.200.2
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.google/dns-query
    - tls://8.8.8.8:853
    - tls://8.8.4.4:853
    - https://cloudflare-dns.com/dns-query
    - tls://1.1.1.1:853
    - tls://1.0.0.1:853
    - https://dns.quad9.net/dns-query
    - tls://9.9.9.9:853
    - tls://149.112.112.112:853
    - https://doh.opendns.com/dns-query
    - tls://208.67.222.222:853
    - https://dns.adguard.com/dns-query
    - tls://94.140.14.14:853

proxies:
  - name: "🇺🇿_4"
    type: vless
    server: "189.74.97.47"
    port: 2087
    uuid: "894fe9f0-b998-49c0-8003-a5007de921e1"
    udp: true
    network: ws
    ws-opts:
      path: "/755276b33b6f"
  - name: "🇺🇿_5"
    type: vless
    server: "157.22.133.130"
    port: 2087
    uuid: "e6d369db-22be-4f30-8685-455c717aaa8c"
    udp: true
    network: ws
    ws-opts:
      path: "/5021201ef53f"
  - name: "🇺🇿_6"
    type: vless
    server: "189.74.97.43"
    port: 2087
    uuid: "10f7eb2d-d96d-4778-9d36-aff11e9d6629"
    udp: true
    network: ws
    ws-opts:
      path: "/73b6faea2d00"

proxy-groups:
  # ── Top-level selector ────────────────────────────────────────────────────
  - name: "PROXY-BEST"
    type: select
    proxies:
      - "SCEN-OPEN"
      - "SCEN-CDN"
      - "UDP-BEST"
      - "FAST-ALL"
      - "LB-ALL"
      - "MANUAL"
      - DIRECT

  # ── Scenario groups ───────────────────────────────────────────────────────
  - name: "SCEN-OPEN"
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 300
    lazy: true
    proxies:
      - "LB-ALL"
      - "FAST-ALL"

  - name: "SCEN-CDN"
    type: fallback
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    lazy: true
    proxies:
      - "LB-CDN"
      - "FAST-CDN"

  # ── Load-balance groups ───────────────────────────────────────────────────
  - name: "LB-ALL"
    type: load-balance
    strategy: consistent-hashing
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 150
    lazy: true
    proxies:
      - "🇺🇿_4"
      - "🇺🇿_5"
      - "🇺🇿_6"

  - name: "LB-CDN"
    type: load-balance
    strategy: round-robin
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 150
    lazy: true
    proxies:
      - "🇺🇿_4"
      - "🇺🇿_5"
      - "🇺🇿_6"

  # ── Fastest-proxy groups ──────────────────────────────────────────────────
  - name: "FAST-ALL"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    proxies:
      - "🇺🇿_4"
      - "🇺🇿_5"
      - "🇺🇿_6"

  - name: "FAST-CDN"
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    proxies:
      - "🇺🇿_4"
      - "🇺🇿_5"
      - "🇺🇿_6"

  # ── UDP group ─────────────────────────────────────────────────────────────
  - name: "UDP-BEST"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    lazy: true
    proxies:
      - "🇺🇿_4"
      - "🇺🇿_5"
      - "🇺🇿_6"

  # ── Manual selector ───────────────────────────────────────────────────────
  - name: "MANUAL"
    type: select
    proxies:
      - "🇺🇿_4"
      - "🇺🇿_5"
      - "🇺🇿_6"

rules:
  - MATCH,PROXY-BEST
